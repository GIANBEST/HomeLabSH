services:
  db:
    image: mariadb:11
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ./db:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT}
      - MARIADB_PASSWORD=${DB_PASS}
      - MARIADB_DATABASE=nextcloud
      - MARIADB_USER=nextcloud
  redis:
    image: redis:7-alpine
    restart: always
  app:
    image: nextcloud:35
    restart: always
    ports:
      - 8080:80
    depends_on:
      - db
      - redis
    volumes:
      - ./html:/var/www/html
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${DB_PASS}
      - REDIS_HOST=redis
      - NEXTCLOUD_TRUSTED_DOMAINS=IP_DA_VM
      - NEXTCLOUD_ADMIN_USER=${NC_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NC_PASS}
  cron:
    image: nextcloud:35
    restart: always
    entrypoint: /cron.sh
    depends_on:
      - db
      - redis
    volumes:
      - ./html:/var/www/html
